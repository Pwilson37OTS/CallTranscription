worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;
    # Route /webhooks/* and /health to FastAPI (webhook receiver)
    # Route everything else to Streamlit

    upstream streamlit {
        server 127.0.0.1:8501;
    }

    upstream webhook {
        server 127.0.0.1:8081;
    }

    server {
        listen 8080;

        # Webhook endpoints -> FastAPI
        location /webhooks/ {
            proxy_pass http://webhook;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header x-cloudcall-sig $http_x_cloudcall_sig;
        }

        location = /health {
            proxy_pass http://webhook;
        }

        # Everything else -> Streamlit
        location / {
            proxy_pass http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /_stcore/ {
            proxy_pass http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
