name: CI

on:
  push:
    branches: [main, "phase*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          OPENAI_API_KEY: test-key-not-real
        run: python -m pytest tests/ -v --tb=short

      - name: Run tests with coverage
        env:
          OPENAI_API_KEY: test-key-not-real
        run: python -m pytest tests/ --cov=. --cov-report=term-missing --cov-fail-under=60

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t calltranscription:test .
